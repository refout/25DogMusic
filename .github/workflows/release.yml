name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rid: win-x64
          - name: linux-x64
            os: ubuntu-latest
            rid: linux-x64
          - name: macos-arm64
            os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libvlc-dev vlc-plugin-base

      - name: Resolve version
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME.TrimStart('v', 'V')
          } else {
            "0.0.0-dev.$env:GITHUB_RUN_NUMBER"
          }
          "APP_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Publish (AOT, ${{ matrix.rid }})
        shell: pwsh
        run: >
          dotnet publish src/25DogMusic.Desktop/25DogMusic.Desktop.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishAot=true
          -p:Version=$env:APP_VERSION
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:CopyOutputSymbolsToPublishDirectory=false
          -o publish/${{ matrix.name }}

      # ---------- Windows：裁剪 + 安装包 ----------
      - name: Trim package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "publish/windows-x64"

          # 只保留目标架构的 VLC 运行时
          foreach ($arch in "win-x86", "win-arm64") {
            $path = Join-Path $out "libvlc/$arch"
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }

          # 去掉调试符号与导入库
          Get-ChildItem $out -Recurse -Include *.pdb, *.lib -File -ErrorAction SilentlyContinue |
            Remove-Item -Force

          # 只保留音频播放用到的 VLC 插件（按模块文件名裁剪）
          $keepModules = @(
            # codec：音频解码
            "libadpcm_plugin", "libaes3_plugin", "libaraw_plugin", "libavcodec_plugin", "libflac_plugin",
            "libg711_plugin", "liblpcm_plugin", "libmpg123_plugin", "libopus_plugin", "libspeex_plugin",
            "libuleaddvaudio_plugin", "libvorbis_plugin",
            # demux：音频容器与播放列表
            "libaiff_plugin", "libasf_plugin", "libau_plugin", "libcaf_plugin", "libdirectory_demux_plugin",
            "libes_plugin", "libflacsys_plugin", "libmkv_plugin", "libmod_plugin", "libmp4_plugin",
            "libnoseek_plugin", "libogg_plugin", "libplaylist_plugin", "librawaud_plugin", "libsmf_plugin",
            "libtta_plugin", "libvoc_plugin", "libwav_plugin", "libxa_plugin",
            # access：本地文件与 HTTP 代理
            "libaccess_concat_plugin", "libaccess_imem_plugin", "libfilesystem_plugin", "libhttp_plugin", "libimem_plugin",
            # 音频滤镜 / 重采样 / 均衡器
            "libaudio_format_plugin", "libequalizer_plugin", "libparam_eq_plugin", "libscaletempo_plugin",
            "libsimple_channel_mixer_plugin", "libspeex_resampler_plugin", "libtrivial_channel_mixer_plugin",
            "libugly_resampler_plugin",
            # packetizer：音频
            "libpacketizer_copy_plugin", "libpacketizer_dts_plugin", "libpacketizer_flac_plugin",
            "libpacketizer_mlp_plugin", "libpacketizer_mpeg4audio_plugin", "libpacketizer_mpegaudio_plugin",
            # stream_filter
            "libcache_block_plugin", "libcache_read_plugin", "libinflate_plugin", "libprefetch_plugin",
            "libskiptags_plugin"
          )
          $plugins = Join-Path $out "libvlc/win-x64/plugins"
          if (Test-Path $plugins) {
            foreach ($dir in "codec", "demux", "access", "audio_filter", "packetizer", "stream_filter") {
              $path = Join-Path $plugins $dir
              if (-not (Test-Path $path)) { continue }
              Get-ChildItem $path -File |
                Where-Object { $keepModules -notcontains $_.BaseName } |
                Remove-Item -Force
            }
            # 整体移除音频用不到的插件目录（视频/流媒体/字幕等）
            $keepDirs = @(
              "access", "audio_filter", "audio_mixer", "audio_output", "codec", "demux",
              "keystore", "logger", "packetizer", "stream_filter"
            )
            Get-ChildItem $plugins -Directory |
              Where-Object { $keepDirs -notcontains $_.Name } |
              ForEach-Object { Remove-Item $_.FullName -Recurse -Force }
            Get-ChildItem $plugins -Recurse -Directory |
              Where-Object { -not (Get-ChildItem $_.FullName -Recurse -File -ErrorAction SilentlyContinue) } |
              Remove-Item -Force
          }

          # 播放不需要的附加资源
          foreach ($extra in "hrtfs", "lua") {
            $path = Join-Path $out "libvlc/win-x64/$extra"
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }

          $size = (Get-ChildItem $out -Recurse -File | Measure-Object Length -Sum).Sum
          "裁剪后：{0} 个文件，{1:N1} MB" -f (Get-ChildItem $out -Recurse -File).Count, ($size / 1MB)

      - name: Package zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$env:GITHUB_RUN_NUMBER" }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "publish/windows-x64/*" -DestinationPath "dist/25DogMusic-$ver-win-x64.zip" -Force

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1).FullName
          }
          if (-not $iscc) { throw "未找到 Inno Setup 的 ISCC.exe" }

          # 安装包安装器不自带中文语言文件，使用仓库内的一份
          $langDir = Join-Path (Get-Item $iscc).Directory.FullName "Languages"
          New-Item -ItemType Directory -Path $langDir -Force | Out-Null
          Copy-Item "installer/ChineseSimplified.isl" (Join-Path $langDir "ChineseSimplified.isl") -Force

          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$env:GITHUB_RUN_NUMBER" }
          & $iscc "/DAPP_VERSION=$ver" "installer/25DogMusic.iss"
          Get-ChildItem dist

      # ---------- Linux：附带 VLC 与启动脚本 ----------
      - name: Bundle VLC and launcher (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          OUT="publish/linux-x64"
          LIB="$OUT/libvlc/linux-x64"
          mkdir -p "$LIB/plugins" "$LIB/sysdeps"

          # libvlc 核心库与插件
          cp -L /usr/lib/x86_64-linux-gnu/libvlc.so.* "$LIB"/
          cp -L /usr/lib/x86_64-linux-gnu/libvlccore.so.* "$LIB"/
          core=$(basename "$(ls "$LIB"/libvlc.so.* | head -n 1)")
          cc=$(basename "$(ls "$LIB"/libvlccore.so.* | head -n 1)")
          ln -sf "$core" "$LIB/libvlc.so"
          ln -sf "$cc" "$LIB/libvlccore.so"
          cp -a /usr/lib/x86_64-linux-gnu/vlc/plugins/. "$LIB/plugins"/

          # 只保留音频播放用到的插件模块
          KEEP_MODULES="
          libadpcm_plugin libaes3_plugin libaraw_plugin libavcodec_plugin libflac_plugin
          libg711_plugin liblpcm_plugin libmpg123_plugin libopus_plugin libspeex_plugin
          libuleaddvaudio_plugin libvorbis_plugin
          libaiff_plugin libasf_plugin libau_plugin libcaf_plugin libdirectory_demux_plugin
          libes_plugin libflacsys_plugin libmkv_plugin libmod_plugin libmp4_plugin
          libnoseek_plugin libogg_plugin libplaylist_plugin librawaud_plugin libsmf_plugin
          libtta_plugin libvoc_plugin libwav_plugin libxa_plugin
          libaccess_concat_plugin libaccess_imem_plugin libfilesystem_plugin libhttp_plugin libimem_plugin
          libaudio_format_plugin libequalizer_plugin libparam_eq_plugin libscaletempo_plugin
          libsimple_channel_mixer_plugin libspeex_resampler_plugin libtrivial_channel_mixer_plugin
          libugly_resampler_plugin
          libpacketizer_copy_plugin libpacketizer_dts_plugin libpacketizer_flac_plugin
          libpacketizer_mlp_plugin libpacketizer_mpeg4audio_plugin libpacketizer_mpegaudio_plugin
          libcache_block_plugin libcache_read_plugin libinflate_plugin libprefetch_plugin libskiptags_plugin
          "
          KEEP_MODULES=$(printf '%s' "$KEEP_MODULES" | tr '\n' ' ')
          for dir in codec demux access audio_filter packetizer stream_filter; do
            [ -d "$LIB/plugins/$dir" ] || continue
            for f in "$LIB/plugins/$dir"/*; do
              [ -f "$f" ] || continue
              base=$(basename "$f"); base="${base%.*}"
              case " $KEEP_MODULES " in *" $base "*) ;; *) rm -f "$f" ;; esac
            done
          done
          # 整体移除音频用不到的插件目录
          KEEP_DIRS="access audio_filter audio_mixer audio_output codec demux keystore logger packetizer stream_filter"
          for dir in "$LIB/plugins"/*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            case " $KEEP_DIRS " in *" $name "*) ;; *) rm -rf "$dir" ;; esac
          done
          find "$LIB/plugins" -type d -empty -delete

          # 插件依赖的第三方共享库
          for f in "$LIB"/plugins/*/*.so; do
            ldd "$f" 2>/dev/null | awk '{print $3}' | grep '^/' || true
          done | sort -u \
            | grep -vE 'libc\.so|libm\.so|libdl\.so|libpthread|librt\.so|libgcc_s|libstdc\+\+|ld-linux|libX11|libwayland' \
            | while read -r dep; do cp -L "$dep" "$LIB/sysdeps/" 2>/dev/null || true; done

          cat > "$OUT/25DogMusic.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/libvlc/linux-x64:$DIR/libvlc/linux-x64/sysdeps${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export VLC_PLUGIN_PATH="$DIR/libvlc/linux-x64/plugins"
          exec "$DIR/25DogMusic" "$@"
          SH
          chmod +x "$OUT/25DogMusic.sh"

          # 去掉调试符号
          find "$OUT" -name '*.pdb' -delete

          VER="${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VER="dev-${GITHUB_RUN_NUMBER}"; fi
          mkdir -p dist
          tar -czf "dist/25DogMusic-$VER-linux-x64.tar.gz" -C publish linux-x64
          du -sh "$OUT" dist/*

      # ---------- macOS：附带 VLC + .app 包 ----------
      - name: Bundle app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          OUT="publish/macos-arm64"
          PLUGINS="$OUT/libvlc/osx-arm64/lib/vlc/plugins"

          # 只保留音频播放用到的插件模块
          KEEP_MODULES="
          libadpcm_plugin libaes3_plugin libaraw_plugin libavcodec_plugin libflac_plugin
          libg711_plugin liblpcm_plugin libmpg123_plugin libopus_plugin libspeex_plugin
          libuleaddvaudio_plugin libvorbis_plugin
          libaiff_plugin libasf_plugin libau_plugin libcaf_plugin libdirectory_demux_plugin
          libes_plugin libflacsys_plugin libmkv_plugin libmod_plugin libmp4_plugin
          libnoseek_plugin libogg_plugin libplaylist_plugin librawaud_plugin libsmf_plugin
          libtta_plugin libvoc_plugin libwav_plugin libxa_plugin
          libaccess_concat_plugin libaccess_imem_plugin libfilesystem_plugin libhttp_plugin libimem_plugin
          libaudio_format_plugin libequalizer_plugin libparam_eq_plugin libscaletempo_plugin
          libsimple_channel_mixer_plugin libspeex_resampler_plugin libtrivial_channel_mixer_plugin
          libugly_resampler_plugin
          libpacketizer_copy_plugin libpacketizer_dts_plugin libpacketizer_flac_plugin
          libpacketizer_mlp_plugin libpacketizer_mpeg4audio_plugin libpacketizer_mpegaudio_plugin
          libcache_block_plugin libcache_read_plugin libinflate_plugin libprefetch_plugin libskiptags_plugin
          "
          KEEP_MODULES=$(printf '%s' "$KEEP_MODULES" | tr '\n' ' ')
          if [ -d "$PLUGINS" ]; then
            for dir in codec demux access audio_filter packetizer stream_filter; do
              [ -d "$PLUGINS/$dir" ] || continue
              for f in "$PLUGINS/$dir"/*; do
                [ -f "$f" ] || continue
                base=$(basename "$f"); base="${base%.*}"
                case " $KEEP_MODULES " in *" $base "*) ;; *) rm -f "$f" ;; esac
              done
            done
            # 整体移除音频用不到的插件目录
            KEEP_DIRS="access audio_filter audio_mixer audio_output codec demux keystore logger packetizer stream_filter"
            for dir in "$PLUGINS"/*; do
              [ -d "$dir" ] || continue
              name=$(basename "$dir")
              case " $KEEP_DIRS " in *" $name "*) ;; *) rm -rf "$dir" ;; esac
            done
            find "$PLUGINS" -type d -empty -delete
          fi
          find "$OUT" -name '*.dSYM' -prune -exec rm -rf {} +

          # 组装 .app
          APP="dist/25DogMusic.app"
          mkdir -p "$APP/Contents/MacOS"
          cp -R "$OUT"/. "$APP/Contents/MacOS/"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>25DogMusic</string>
            <key>CFBundleDisplayName</key><string>25DogMusic</string>
            <key>CFBundleIdentifier</key><string>com.refout.25dogmusic</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>25DogMusic</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          chmod +x "$APP/Contents/MacOS/25DogMusic"

          VER="${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VER="dev-${GITHUB_RUN_NUMBER}"; fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/25DogMusic-$VER-macos-arm64.zip"
          # 只保留压缩包，避免未压缩的 .app 目录被当作产物上传
          rm -rf "$APP"
          du -sh dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: 25DogMusic-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "25DogMusic $GITHUB_REF_NAME" \
            --generate-notes
